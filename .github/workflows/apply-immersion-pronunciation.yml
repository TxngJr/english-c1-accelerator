name: Apply immersion and pronunciation migration

on:
  push:
    branches:
      - chatgpt/immersion-pronunciation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[immersion-pronunciation-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python scripts/apply-immersion-pronunciation.py
      - run: |
          rm scripts/apply-immersion-pronunciation.py
          rm .github/workflows/apply-immersion-pronunciation.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(learning): activate immersion and pronunciation practice [immersion-pronunciation-applied]"
          git push origin HEAD:${{ github.ref_name }}
