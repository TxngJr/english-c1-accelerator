name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production build and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run domain tests
        run: npm test

      - name: Validate curriculum content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run critical browser E2E flows with diagnostic capture
        id: browser_e2e
        shell: bash
        run: |
          set +e
          npm run test:e2e -- --reporter=line 2>&1 | tee e2e-debug.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit ${code}

      - name: Commit one-shot E2E failure log
        if: ${{ failure() && steps.browser_e2e.outputs.exit_code != '0' && !contains(github.event.head_commit.message, '[e2e-debug-log]') }}
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f e2e-debug.log
          git diff --cached --check
          git commit -m "chore(test): capture browser E2E failure [e2e-debug-log]"
          git push origin HEAD:${BRANCH_NAME}
